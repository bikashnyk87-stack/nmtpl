name: Validate SOCP KOCP Entry R6

on:
  push:
    branches:
      - validate-site-entry-r6

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile app/routers/sites.py app/routers/site_ops.py
      - name: JavaScript syntax
        run: node --check app/static/simple_field_v1.js
      - name: Required entry features
        run: |
          grep -q "wbGridRows" app/static/simple_field_v1.js
          grep -q "hsdGridRows" app/static/simple_field_v1.js
          grep -q "meterGridRows" app/static/simple_field_v1.js
          grep -q "R6 — compact high-contrast software entry UI" app/static/simple_field_v1.css
          grep -q "_site_equipment_or_422" app/routers/site_ops.py
          grep -q "_site_vehicle_from_display" app/routers/sites.py
