name: Validate SOCP KOCP Dashboard R9

on:
  push:
    branches:
      - validate-dashboard-r9-20261005

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile app/routers/site_ops.py
      - name: JavaScript syntax
        run: node --check app/static/simple_field_v1.js
      - name: Theme checks
        run: |
          grep -q "ops-theme-socp" app/static/simple_field_v1.js
          grep -q "ops-theme-kocp" app/static/simple_field_v1.js
          grep -q "R9 — site-specific dashboard themes" app/static/simple_field_v1.css
          grep -q "Entry Workspace" app/static/simple_field_v1.js
          grep -q "dashboard/operations" app/routers/site_ops.py
