name: Validate TIOM Production TPH R17

on:
  push:
    branches:
      - validate-tiom-prod-tph-r17

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile app/main.py app/site_models.py app/services/tiom_erp.py app/services/tiom_location_erp.py app/routers/webapp.py
      - name: JavaScript syntax
        run: node --check app/static/workspace.js
      - name: Business-rule checks
        run: |
          grep -q "SCREEN_FINES','SCREEN_5_18','CRUSHER_FINES','CRUSHER_5_18" app/routers/webapp.py
          grep -q "PROJECT_AREA_FINES_TO_STACK" app/routers/webapp.py
          grep -q "tripsPerHour" app/routers/webapp.py
          grep -q "tripKmPerHour" app/routers/webapp.py
          grep -q "tonKmPerHour" app/routers/webapp.py
          grep -q "FIXED_LEAD_NOT_CONFIGURED" app/routers/webapp.py
          grep -q "ensure_tiom_routes_from_history" app/services/tiom_location_erp.py
          grep -q "Crusher CLO (5-18)" app/static/workspace.js
          grep -q "Trips / Hr (TPH)" app/static/workspace.js
          grep -q "Old Stock Re-handled" app/static/workspace.js
          grep -q "fixedLeadKm" app/static/workspace.js
          ! grep -q "leadTable" app/static/workspace.js
