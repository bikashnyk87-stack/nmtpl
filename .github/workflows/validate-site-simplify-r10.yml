name: Validate SOCP KOCP Simplification R10

on:
  push:
    branches:
      - validate-site-simplify-r10-20261005

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile app/routers/sites.py app/routers/site_ops.py
      - name: JavaScript syntax
        run: node --check app/static/simple_field_v1.js
      - name: Simplification checks
        run: |
          ! grep -A5 '"SOCP": \[' app/routers/sites.py | grep -q 'ATTENDANCE'
          ! grep -A6 '"KOCP": \[' app/routers/sites.py | grep -q 'SHIFT_CONTROL'
          grep -q '"ACTIVE_USED"' app/routers/site_ops.py
          grep -q 'MaintenanceBreakdown' app/routers/site_ops.py
          grep -q 'setup:\[\]' app/static/simple_field_v1.js
