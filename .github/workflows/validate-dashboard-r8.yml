name: Validate SOCP KOCP Dashboard R8

on:
  push:
    branches:
      - validate-dashboard-r8-20261005

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile app/routers/site_ops.py
      - name: JavaScript syntax
        run: node --check app/static/simple_field_v1.js
      - name: Dashboard feature checks
        run: |
          grep -q "dashboard/operations" app/routers/site_ops.py
          grep -q "renderSimpleDashboard" app/static/simple_field_v1.js
          grep -q "Operations Dashboard" app/static/simple_field_v1.js
          grep -q "MCL / Billing Control" app/static/simple_field_v1.js
          grep -q "R8 — dedicated SOCP / KOCP operational dashboard" app/static/simple_field_v1.css
