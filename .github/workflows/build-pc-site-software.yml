name: Build Consolidated PC Site Software

on:
  push:
    branches: [pc-consolidated-site-20261005]
    paths:
      - ".github/workflows/build-pc-site-software.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="NMTPL_PC_SITE_SOFTWARE_R1"
          PAY="$ROOT/payload"
          mkdir -p "$PAY"

          files=(
            "app/models.py"
            "app/site_models.py"
            "app/routers/sites.py"
            "app/routers/site_ops.py"
            "app/services/site_context.py"
            "app/services/tiom_location_erp.py"
            "app/services/wb_mapping.py"
            "app/static/admin_master_ops.js"
            "app/static/central.html"
            "app/static/site.js"
            "app/static/site_ops.js"
            "app/static/site_master_ops.js"
            "app/static/site.html"
            "app/static/simple_field_v1.js"
            "app/static/simple_field_v1.css"
          )

          for f in "${files[@]}"; do
            test -f "$f"
            mkdir -p "$PAY/$(dirname "$f")"
            cp "$f" "$PAY/$f"
          done

          mkdir -p "$PAY/app"
