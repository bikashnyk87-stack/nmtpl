name: Apply drilling route ERP feature

on:
  push:
    branches:
      - feature/drilling-route-lead-build2
    paths:
      - ".dev/tiom_drill_route_feature.patch.gz.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drilling-route-lead-build2

      - name: Apply validated feature patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .dev/tiom_drill_route_feature.patch.gz.b64 | gzip -d > /tmp/tiom.patch
          patch -p1 < /tmp/tiom.patch

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/site_models.py app/routers/webapp.py app/services/tiom_location_erp.py
          node --check app/static/tiom_phase1.js
          node --check app/static/workspace.js
          grep -q "class TiomRouteMaster" app/site_models.py
          grep -q "class TiomDrillSet" app/site_models.py
          grep -q "getTiomDrillingDesk" app/routers/webapp.py
          grep -q "Drilling Summary" app/static/workspace.js
          grep -q "Route Master" app/static/workspace.js
          grep -q "FACE / BENCH SETUP" app/static/tiom_phase1.js

      - name: Commit validated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Feature Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/site_models.py app/routers/webapp.py app/services/tiom_location_erp.py app/static/tiom_phase1.js app/static/workspace.js app/static/index.html
          git commit -m "Add drilling, route and automatic lead ERP workflow [skip ci]"
          git push origin HEAD:feature/drilling-route-lead-build2
