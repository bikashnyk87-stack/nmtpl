name: TIOM equipment HMR compact UI checks

on:
  pull_request:
    paths:
      - "app/static/tiom_phase1.js"
      - "app/static/tiom_phase1.css"
      - "app/static/index.html"
      - "tests/test_tiom_hmr_compact_transfer_ui.py"
      - "tests/test_tiom_machine_transfer.py"
      - "app/routers/webapp.py"
      - "tests/test_tiom_transfer_saved_shift_end.py"
      - "tests/tiom_transfer_saved_shift_end.cjs"
      - ".github/workflows/tiom-hmr-compact.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify JavaScript syntax
        run: node --check app/static/tiom_phase1.js
      - name: Verify real transfer popup with saved shift-end allocation
        run: node tests/tiom_transfer_saved_shift_end.cjs
      - name: Verify HMR layout and transfer compatibility
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_tiom_hmr_compact_transfer_ui.py tests/test_tiom_machine_transfer.py tests/test_tiom_source_correction.py tests/test_tiom_transfer_saved_shift_end.py
