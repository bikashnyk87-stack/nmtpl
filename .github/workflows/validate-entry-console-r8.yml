name: Validate SOCP KOCP Entry Console R8

on:
  push:
    branches:
      - validate-entry-console-r8

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app/static/simple_field_v1.js
      - name: Required entry-console features
        run: |
          grep -q "SOCP Data Entry Console" app/static/simple_field_v1.js
          grep -q "KOCP Data Entry Console" app/static/simple_field_v1.js
          grep -q "Apply Defaults to Blank Rows" app/static/simple_field_v1.js
          grep -q "stDefaultSource" app/static/simple_field_v1.js
          grep -q "stDefaultDest" app/static/simple_field_v1.js
          grep -q "stDefaultMaterial" app/static/simple_field_v1.js
          grep -q "sourceLocationId" app/static/simple_field_v1.js
          grep -q "destinationLocationId" app/static/simple_field_v1.js
          grep -q "R8 — data-entry-first SOCP / KOCP structure" app/static/simple_field_v1.css
