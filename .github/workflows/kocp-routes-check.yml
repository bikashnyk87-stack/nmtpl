name: KOCP movement route checks

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed Python and JavaScript
        run: |
          python -m py_compile app/site_models.py app/site_schemas.py app/routers/sites.py app/routers/site_ops.py app/routers/site_routes.py app/routers/site_material_types.py
          node --check app/static/site_routes.js
          node --check app/static/kocp_masters_compact.js
          node --check app/static/site_master_ops.js
          node --check app/static/simple_field_v1.js
      - name: Install lightweight route test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "fastapi>=0.115,<1" "SQLAlchemy>=2,<3" "python-dotenv>=1,<2" "pydantic>=2.9,<3" "openpyxl>=3.1,<4" "python-multipart>=0.0.9,<1" httpx2
      - name: Run KOCP movement master tests
        run: python -m pytest -q tests/test_kocp_movement_routes.py tests/test_kocp_material_catalog.py tests/test_kocp_activity_picker.py tests/test_kocp_hsd_picker.py tests/test_kocp_fuel_dashboard_batch.py tests/test_kocp_compact_hsd_live_balance.py
