<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-label="Illustrated open cast mine with excavator, haul truck and conveyor" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#071724"/><stop offset=".55" stop-color="#123443"/><stop offset="1" stop-color="#213b3e"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#ffc97a" stop-opacity=".38"/><stop offset="1" stop-color="#ffc97a" stop-opacity="0"/></radialGradient>
 <linearGradient id="rock" x2="0" y2="1"><stop stop-color="#28515a"/><stop offset="1" stop-color="#11272e"/></linearGradient>
 <linearGradient id="near" x2="0" y2="1"><stop stop-color="#4c3d31"/><stop offset="1" stop-color="#141d22"/></linearGradient>
 <linearGradient id="truck" x2="0" y2="1"><stop stop-color="#ffd373"/><stop offset="1" stop-color="#c98228"/></linearGradient>
 <linearGradient id="exc" x2="0" y2="1"><stop stop-color="#30c3bd"/><stop offset="1" stop-color="#0a696d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="treads" width="22" height="18" patternUnits="userSpaceOnUse"><path d="M0 0L0 18M11 0L11 18" stroke="#455961" stroke-width="3"/></pattern>
</defs>
<style>
 .arm{transform-origin:405px 563px;animation:arm 6.5s ease-in-out infinite}
 .bucket{transform-origin:565px 473px;animation:bucket 6.5s ease-in-out infinite}
 .haul{animation:haul 12s ease-in-out infinite}
 .wheels{transform-box:fill-box;transform-origin:center;animation:wheels 12s linear infinite}
 .belt{animation:belt 1.2s linear infinite}
 .dust{animation:dust 6s ease-in-out infinite}
 .lamp{animation:lamp 2.8s ease-in-out infinite}
 @keyframes arm{0%,100%{transform:rotate(-8deg)}40%{transform:rotate(4deg)}65%{transform:rotate(-4deg)}}
 @keyframes bucket{0%,100%{transform:rotate(8deg)}42%{transform:rotate(-17deg)}65%{transform:rotate(0deg)}}
 @keyframes haul{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
 @keyframes wheels{to{transform:rotate(360deg)}}
 @keyframes belt{to{stroke-dashoffset:-34}}
 @keyframes dust{0%,100%{opacity:.14;transform:translateY(6px)}50%{opacity:.42;transform:translateY(-17px)}}
 @keyframes lamp{0%,100%{opacity:.5}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.arm,.bucket,.haul,.wheels,.belt,.dust,.lamp{animation:none!important}}
</style>
<!-- Sky and distant pit rim -->
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1100" cy="200" r="330" fill="url(#moon)"/>
<g fill="#b5dcdf" opacity=".30"><circle cx="260" cy="125" r="2"/><circle cx="540" cy="88" r="1.5"/><circle cx="945" cy="74" r="2"/><circle cx="1320" cy="134" r="1.5"/><circle cx="1466" cy="256" r="2"/></g>
<path d="M0 480L115 440 220 472 370 388 520 436 735 332 860 392 1080 328 1260 404 1430 355 1600 420V900H0Z" fill="#17333c"/>
<path d="M0 570L150 529 301 545 477 465 674 500 873 438 1075 478 1255 436 1435 483 1600 461V900H0Z" fill="url(#rock)"/>
<!-- Layered benches / working roads -->
<path d="M0 601L255 574 545 606 804 568 1044 598 1332 549 1600 571V900H0Z" fill="#31505a"/>
<path d="M0 637L250 611 530 638 825 599 1045 631 1348 581 1600 602" fill="none" stroke="#809188" stroke-width="6" opacity=".28"/>
<path d="M0 686L250 657 565 683 831 644 1036 679 1320 635 1600 660V900H0Z" fill="#26383b"/>
<path d="M0 724L277 692 560 722 874 676 1085 714 1332 680 1600 705" fill="none" stroke="#84765e" stroke-width="7" opacity=".46"/>
<path d="M0 790L282 750 660 783 1000 734 1300 765 1600 725V900H0Z" fill="url(#near)"/>
<path d="M0 815L290 781 642 814 1000 766 1310 793 1600 767" stroke="#a07b4f" stroke-width="8" opacity=".28" fill="none"/>
<!-- Conveyor and chute -->
<g opacity=".84" transform="translate(980 469)">
 <path d="M22 140L166 18L350 16" stroke="#243940" stroke-width="24" stroke-linecap="round" fill="none"/>
 <path class="belt" d="M22 140L166 18L350 16" stroke="#80a5aa" stroke-width="6" stroke-dasharray="14 20" fill="none"/>
 <path d="M78 96L78 161 M177 32L177 130 M307 17L307 95" stroke="#73878a" stroke-width="11"/>
 <path d="M8 159L102 159M148 141L203 141M274 96L339 96" stroke="#475f65" stroke-width="9"/>
 <path d="M353 19L362 50L340 83" stroke="#927454" stroke-width="8" fill="none"/>
</g>
<!-- Mine floodlights -->
<g stroke="#6e8a8b" stroke-width="9" fill="none"><path d="M110 632V448M1335 602V430M1540 637V468"/></g>
<g class="lamp" fill="#ffe2a4"><circle cx="110" cy="446" r="9"/><circle cx="1335" cy="427" r="9"/><circle cx="1540" cy="463" r="9"/></g>
<g opacity=".18" fill="#ffcc69" filter="url(#glow)"><circle cx="110" cy="446" r="36"/><circle cx="1335" cy="427" r="40"/><circle cx="1540" cy="463" r="35"/></g>
<!-- Excavator -->
<g transform="translate(75 140)">
 <ellipse cx="388" cy="611" rx="253" ry="29" fill="#091116" opacity=".55"/>
 <rect x="205" y="557" width="290" height="64" rx="30" fill="#182a2f" stroke="#6a8082" stroke-width="9"/>
 <rect x="219" y="570" width="263" height="39" rx="19" fill="url(#treads)"/>
 <circle cx="257" cy="588" r="14" fill="#667879"/><circle cx="312" cy="588" r="14" fill="#667879"/><circle cx="370" cy="588" r="14" fill="#667879"/><circle cx="436" cy="588" r="14" fill="#667879"/>
 <path d="M255 548V483L285 433H467L510 480V548Z" fill="url(#exc)" stroke="#096269" stroke-width="6"/>
 <path d="M295 480V429L335 364H412L440 429V480Z" fill="#203d48" stroke="#20bcb4" stroke-width="9"/>
 <path d="M333 430L360 380H404L416 430Z" fill="#a3d4ce" opacity=".58"/>
 <rect x="264" y="495" width="230" height="20" rx="9" fill="#ffd077" opacity=".36"/>
 <g class="arm">
  <path d="M405 563L486 409L568 371" fill="none" stroke="#135b5d" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M405 563L486 409L568 371" fill="none" stroke="url(#exc)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M456 477L510 471" stroke="#d5ded4" stroke-width="8" stroke-linecap="round"/>
  <g class="bucket">
   <path d="M568 371L660 411L639 475L590 464Z" fill="#a1a2a0" stroke="#304850" stroke-width="12" stroke-linejoin="round"/>
   <path d="M602 465L599 485M625 470L630 489" stroke="#a9a9a7" stroke-width="9"/>
  </g>
 </g>
</g>
<!-- A dumper with bright hopper and wheels -->
<g class="haul">
 <ellipse cx="916" cy="785" rx="240" ry="24" fill="#111517" opacity=".45"/>
 <path d="M715 690H1053L1080 721H702Z" fill="#344a4f"/>
 <path d="M778 583L1050 566L1030 686H808Z" fill="url(#truck)" stroke="#aa6329" stroke-width="7"/>
 <path d="M783 580L1039 570" stroke="#fff0b0" stroke-width="10" stroke-linecap="round"/>
 <path d="M1051 626H1132L1163 696V733H1036V666Z" fill="#e5a044" stroke="#a85d26" stroke-width="7"/>
 <path d="M1070 638H1118L1141 687H1070Z" fill="#87acaf" opacity=".82"/>
 <rect x="719" y="716" width="458" height="28" rx="10" fill="#34484c"/>
 <g class="wheels"><circle cx="785" cy="752" r="48" fill="#151e24" stroke="#6b7575" stroke-width="13"/><circle cx="785" cy="752" r="16" fill="#b9b3a0"/><circle cx="1020" cy="752" r="48" fill="#151e24" stroke="#6b7575" stroke-width="13"/><circle cx="1020" cy="752" r="16" fill="#b9b3a0"/><circle cx="1114" cy="752" r="43" fill="#151e24" stroke="#6b7575" stroke-width="12"/><circle cx="1114" cy="752" r="15" fill="#b9b3a0"/></g>
 <rect class="lamp" x="1152" y="705" width="23" height="12" rx="5" fill="#ffe4a6"/>
 <path d="M1170 698L1440 584L1440 775Z" fill="#f9c66d" opacity=".09"/>
</g>
<!-- Small dust motes -->
<g class="dust" fill="#bea47c" opacity=".28"><circle cx="592" cy="688" r="17"/><circle cx="623" cy="667" r="11"/><circle cx="660" cy="699" r="22"/><circle cx="1214" cy="731" r="12"/><circle cx="1260" cy="707" r="19"/><circle cx="1286" cy="736" r="8"/></g>
<path d="M0 862L302 826 590 865 985 821 1331 856 1600 822V900H0Z" fill="#152127" opacity=".88"/>
</svg>